services:
  migrate:
    build:
      context: .
      target: build
    restart: "no"
    env_file: ${APP_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]

  retention:
    build:
      context: .
      target: build
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    command: ["sh", "-c", "while true; do pnpm retention || exit 1; sleep 60; done"]

  app:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='x-forwarded-proto: https' http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  livekit:
    image: livekit/livekit-server:v1.9.0
    restart: unless-stopped
    command: --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP} --rtc.force_tcp
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:7880:7880"
      - "${PUBLISH_HOST:-127.0.0.1}:7881:7881"

volumes:
  postgres_production:
